<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Área do Aluno - IPB</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;background:#f4f6ef;color:#2f3b22;display:flex;min-height:100vh}
    .app-layout{display:flex;width:100%}
    .sidebar{width:280px;background:#3d4f21;color:#f8fafc;padding:20px 15px;height:100vh;position:sticky;top:0;overflow-y:auto;flex-shrink:0;border-right:1px solid #556b2f}
    .sidebar.collapsed{width:60px;padding:15px 10px;overflow-x:hidden}
    .sidebar-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;padding-bottom:10px;border-bottom:1px solid #556b2f}
    .sidebar-header h2{font-size:1.1rem;text-transform:uppercase;letter-spacing:.8px;color:#c5d4a1;white-space:nowrap}
    .sidebar.collapsed .sidebar-header h2,.sidebar.collapsed .sidebar-menu{display:none}
    .btn-toggle-sidebar{background:none;border:none;color:#c5d4a1;font-size:1.4rem;cursor:pointer;width:36px;height:36px;border-radius:6px}
    .btn-toggle-sidebar:hover{background:#556b2f;color:#fff}
    .sidebar.collapsed .sidebar-header{border-bottom:none;margin-bottom:0;padding-bottom:0;justify-content:center}
    .sidebar-menu{list-style:none}
    .sidebar-module{margin-bottom:10px}
    .sidebar-module-title{width:100%;background:none;border:none;color:#eef3e4;font-size:.95rem;font-weight:600;text-align:left;padding:10px 12px;border-radius:6px;cursor:pointer;display:flex;justify-content:space-between;align-items:center}
    .sidebar-module-title:hover{background:#556b2f;color:#fff}
    .sidebar-module-title.locked{color:#9aaa7a;cursor:not-allowed;opacity:.7}
    .sidebar-sublist{list-style:none;padding-left:15px;margin-top:5px;display:none}
    .sidebar-module.active .sidebar-sublist{display:block}
    .sidebar-subitem{width:100%;background:none;border:none;color:#c5d4a1;font-size:.85rem;text-align:left;padding:8px 10px;border-radius:4px;cursor:pointer;display:block}
    .sidebar-subitem:hover{color:#e8f0c8;background:rgba(255,255,255,.05)}
    .main-content{flex:1;padding:30px 25px;max-width:1100px;width:100%;margin:0 auto}
    .header-top{display:flex;justify-content:space-between;align-items:flex-start;gap:15px;margin-bottom:25px}
    .brand{display:flex;align-items:center;gap:14px}
    .brand img{width:64px;height:64px;object-fit:contain}
    .header-title h1{color:#3d4f21;font-size:2rem;margin-bottom:8px}
    .header-title p{color:#6b7a52}
    .btn-collapse-all{background:transparent;color:#556b2f;border:1px solid #c5d0a8;padding:6px 12px;border-radius:6px;font-size:.8rem;font-weight:600;cursor:pointer}
    .accordion-item{background:#fff;border-radius:8px;margin-bottom:20px;box-shadow:0 2px 8px rgba(61,79,33,.08);overflow:hidden;border:3px solid transparent}
    .accordion-item.is-locked{background:#f4f6ef}
    .accordion-header{width:100%;background:transparent;border:none;padding:20px 25px;font-size:1.15rem;font-weight:600;color:#1b1b1b;text-align:left;cursor:pointer;display:flex;justify-content:space-between;align-items:center}
    .accordion-item.is-locked .accordion-header{cursor:not-allowed}
    .lock-notice{font-size:.85rem;background:#efe9c8;color:#6b5b16;padding:6px 12px;border-radius:6px;font-weight:600}
    .toggle-icon{width:32px;height:32px;background:#efe3c8;color:#6b5b16;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.4rem;font-weight:bold;margin-left:15px}
    .accordion-item.active>.accordion-header .toggle-icon,.doc-accordion.active>.doc-header .toggle-icon{transform:rotate(45deg)}
    .accordion-body,.doc-body{max-height:0;overflow:hidden;transition:max-height .3s ease}
    .accordion-content{padding:0 18px 25px;border-top:1px solid #e8eedc}
    .section-block{margin-top:18px;width:100%}
    .lesson-block+.lesson-block{border-top:2px solid #A0A0A0;padding-top:18px;margin-top:22px}
    .lesson-text{line-height:1.6;color:#4a5a32;white-space:pre-wrap}
    .video-responsive{position:relative;padding-bottom:56.25%;height:0;overflow:hidden;border-radius:8px;width:100%}
    .video-responsive iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
    .audio-container{padding:12px 16px;width:100%}
    audio.audio-player{width:100%;height:40px}
    .doc-accordion{width:100%;border:1px solid #c5d0a8;border-radius:10px;overflow:hidden;background:#f4f6ef;margin-top:12px}
    .doc-header{width:100%;background:#e8eedc;border:none;padding:12px 16px;font-size:.82rem;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:#3d4f21;display:flex;justify-content:space-between;align-items:center;cursor:pointer}
    .doc-header .toggle-icon{width:28px;height:28px;font-size:1.1rem;margin-left:8px}
    .doc-frame-container{width:100%;height:min(80vh,920px);min-height:640px;background:#fff;border-top:1px solid #d7dfc6}
    .doc-frame-container iframe{width:100%;height:100%;border:none;display:block}
    .licao-frame{width:100%;min-height:980px;height:80vh;border:1px solid #d7dfc6;border-radius:8px;background:#fff}
    .doc-footer{padding:10px 16px;background:#f4f6ef;border-top:1px solid #d7dfc6;text-align:right}
    .btn-link-general{display:inline-flex;align-items:center;gap:8px;background:#556b2f;color:#fff;padding:8px 14px;border-radius:6px;text-decoration:none;font-weight:600;font-size:.82rem}
    .materiais-bloqueados{width:100%;margin-top:12px;background:#efe9c8;color:#6b5b16;border:1px dashed #c9b86a;border-radius:8px;padding:14px 16px;font-size:.92rem;font-weight:600;text-align:center}
    .empty-state{text-align:center;padding:40px;background:#fff;border-radius:8px;color:#6b7a52}
    .lesson-title{font-size:1.05rem;color:#3d4f21;margin-bottom:8px}
    @media(max-width:768px){
      .app-layout{flex-direction:column}
      .sidebar{width:100%;height:auto;position:relative}
      .main-content{max-width:100%;padding:16px 10px}
      .doc-frame-container{min-height:480px;height:70vh}
    }
  </style>
</head>
<body>
  <div class="app-layout">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <h2>📚 Módulos</h2>
        <button class="btn-toggle-sidebar" onclick="toggleSidebar()">☰</button>
      </div>
      <ul class="sidebar-menu" id="sidebar-menu"></ul>
    </aside>
    <main class="main-content">
      <div class="header-top">
        <div class="brand">
          <img src="logo-ipb.png" alt="IPB" onerror="this.src='https://commons.wikimedia.org/wiki/Special:FilePath/Ipb_logo.png'">
          <div class="header-title">
            <h1 id="course-title-display">Discipulado IPB</h1>
            <p id="course-subtitle-display">Acesse os módulos e aulas abaixo</p>
          </div>
        </div>
        <button class="btn-collapse-all" onclick="collapseAllModules()">▲ Fechar todos</button>
      </div>
      <div id="course-modules"></div>
    </main>
  </div>
  <script>
    const CORES_TITULO_MODULO=['#C8E6C9','#E3F2FD','#FFFDE7','#FFF3E0','#FFEBEE','#FCE4EC','#F3E5F5','#EFEBE9'];
    function corTituloModulo(i){return CORES_TITULO_MODULO[i%8]}
    const FIREBASE_URL='https://discipulado-2026-default-rtdb.firebaseio.com/curso_ipb_palmeiras202609.json';
    const LS_TITLE='ipb_course_title_palmeiras202609';
    const LS_SUBTITLE='ipb_course_subtitle_palmeiras202609';
    const LS_MODULES='ipb_course_modules_palmeiras202609';
    const DEFAULT_EMAIL='emersonbaran@gmail.com';
    const videosLiberados=new Set();
    let lastCourseSnapshot='';

    function chaveLiberacao(m,l){return 'ipb_materiais_liberados_palmeiras202609_'+m+'_'+l}
    function materiaisLiberados(lesson,m,l){
      if(!lesson.firstHtmlPage&&!lesson.lockLinksUntilLessonSubmit)return true;
      return videosLiberados.has(m+'-'+l)||localStorage.getItem(chaveLiberacao(m,l))==='1';
    }
    function iframeDaLicao(m,l){return document.querySelector('#doc-item-'+m+'-'+l+'-html iframe.licao-frame')}
    function todasAlternativasFeitas(doc){
      if(!doc)return false;
      const radios=Array.from(doc.querySelectorAll('input[type="radio"]'));
      if(radios.length){
        const grupos=new Map();
        radios.forEach((r,idx)=>{
          let key=r.name;
          if(!key){
            const bloco=r.closest('[data-questao], .questao, .pergunta, .question, fieldset, .item-questao, .q-item, .bloco-questao');
            key=bloco?'bloco-'+(bloco.id||bloco.getAttribute('data-questao')||Array.prototype.indexOf.call(bloco.parentNode.children,bloco)):'radio-'+idx;
          }
          if(!grupos.has(key))grupos.set(key,[]);
          grupos.get(key).push(r);
        });
        for(const grupo of grupos.values()){if(!grupo.some(r=>r.checked))return false}
      }
      for(const s of doc.querySelectorAll('select')){if(!s.disabled&&!String(s.value||'').trim())return false}
      for(const t of doc.querySelectorAll('textarea, input[type="text"], input[type="number"], input:not([type])')){
        if(t.disabled||t.readOnly)continue;
        const exige=t.required||t.getAttribute('data-obrigatorio')==='1'||t.classList.contains('resposta')||t.closest('.questao, .pergunta, [data-questao]');
        if(exige&&!String(t.value||'').trim())return false;
      }
      if(!radios.length&&!doc.querySelectorAll('select').length){
        const clicaveis=Array.from(doc.querySelectorAll('[data-alternativa], .alternativa, .alt, .opcao'));
        if(!clicaveis.length)return false;
        const blocos=new Map();
        clicaveis.forEach((el,idx)=>{
          const bloco=el.closest('[data-questao], .questao, .pergunta, fieldset')||el.parentElement||el;
          const key=bloco.id||bloco.getAttribute('data-questao')||'b'+idx;
          if(!blocos.has(key))blocos.set(key,[]);
          blocos.get(key).push(el);
        });
        for(const grupo of blocos.values()){
          if(!grupo.some(el=>el.classList.contains('selecionada')||el.classList.contains('selected')||el.classList.contains('ativa')||el.getAttribute('aria-checked')==='true'||(el.querySelector&&el.querySelector('input:checked'))))return false;
        }
      }
      return true;
    }
    function licaoEstaCompleta(iframe){
      try{
        if(!iframe)return false;
        const win=iframe.contentWindow;
        const doc=iframe.contentDocument||(win&&win.document);
        if(win&&typeof win.todasRespostasPreenchidas==='function')return!!win.todasRespostasPreenchidas();
        if(win&&typeof win.verificarRespostasCompletas==='function')return!!win.verificarRespostasCompletas();
        if(win&&win.LICAO_COMPLETA===true)return true;
        return todasAlternativasFeitas(doc);
      }catch(e){return false}
    }
    function tentarLiberarMateriais(m,l){
      const iframe=iframeDaLicao(m,l);
      if(!licaoEstaCompleta(iframe)){alert('Responda todas as alternativas da lição antes de clicar em Corrigir Respostas.');return false}
      marcarMateriaisLiberados(m,l);return true;
    }
    function marcarMateriaisLiberados(m,l){
      videosLiberados.add(m+'-'+l);
      localStorage.setItem(chaveLiberacao(m,l),'1');
      liberarMateriaisNaTela(m,l);
      const iframe=iframeDaLicao(m,l);
      if(iframe&&iframe.contentWindow)iframe.contentWindow.postMessage({type:'LIBERAR_PDF'},'*');
    }
    window.liberarVideoAula=function(m,l){tentarLiberarMateriais(m,l)};
    function ehPdf(url){return /\.pdf(\?|#|$)/i.test(url||'')}
    function isLocked(dateStr){return dateStr?new Date()<new Date(dateStr):false}
    function formatYouTubeUrl(url){
      const match=(url||'').match(/^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/);
      return(match&&match[2].length===11)?'https://www.youtube.com/embed/'+match[2]:null;
    }
    function formatGoogleDocsEmbedUrl(url){
      if(!url)return null;
      const fileId=(url.match(/\/file\/d\/([a-zA-Z0-9_-]+)/)||[])[1];
      if(fileId)return 'https://drive.google.com/file/d/'+fileId+'/preview';
      const docId=(url.match(/\/document\/d\/([a-zA-Z0-9_-]+)/)||[])[1];
      if(docId)return 'https://docs.google.com/document/d/'+docId+'/preview';
      const presId=(url.match(/\/presentation\/d\/([a-zA-Z0-9_-]+)/)||[])[1];
      if(presId)return 'https://docs.google.com/presentation/d/'+presId+'/embed?start=false&loop=false';
      const sheetId=(url.match(/\/spreadsheets\/d\/([a-zA-Z0-9_-]+)/)||[])[1];
      if(sheetId)return 'https://docs.google.com/spreadsheets/d/'+sheetId+'/preview';
      if(url.includes('docs.google.com')||url.includes('drive.google.com'))return url.replace(/\/pub(\?.*)?$/,'/preview').replace(/\/edit(\?.*)?$/,'/preview').replace(/\/view(\?.*)?$/,'/preview');
      return null;
    }
    function isAudioUrl(url){return /\.(mp3|wav|ogg|m4a|aac)(\?|#|$)/i.test(url||'')||/audio|sound/i.test(url||'')}
    function avisoMateriaisBloqueados(){return '<div class="materiais-bloqueados">🔒 Vídeo e documentos só liberam depois de responder <strong>todas as alternativas</strong> e clicar em <strong>Corrigir Respostas</strong>.</div>'}
    function estiloBarraModulo(cor){return 'background:'+cor+';'}
    function htmlDoVideoLiberado(lesson,m,l,corTitulo){
      const yt=formatYouTubeUrl(lesson.videoUrl);
      const cor=corTitulo||corTituloModulo(m);
      return '<div class="doc-accordion" id="doc-item-'+m+'-'+l+'-video"><button class="doc-header" style="'+estiloBarraModulo(cor)+'" onclick="toggleDocAccordion('+m+','+l+',\'video\')"><span>🎬 '+(lesson.videoTitle||'Vídeo da aula')+'</span><span class="toggle-icon">×</span></button><div class="doc-body" id="doc-body-'+m+'-'+l+'-video"><div>'+(yt?'<div class="video-responsive"><iframe src="'+yt+'" allowfullscreen></iframe></div>':'<a class="btn-link-general" href="'+lesson.videoUrl+'" target="_blank">Abrir vídeo</a>')+'</div></div></div>';
    }
    function renderMaterialItem(item,m,l,i,corTitulo){
      const titulo=item.subtitle||item.title||'Material';
      const key='link'+i;
      const cor=corTitulo||corTituloModulo(m);
      if(isLocked(item.releaseDate))return '<div class="doc-accordion"><div class="doc-header" style="cursor:not-allowed;color:#6b7a52;'+estiloBarraModulo(cor)+'"><span>🔒 '+titulo+'</span><div class="lock-notice">Disponível em: '+new Date(item.releaseDate).toLocaleString('pt-BR')+'</div></div></div>';
      const yt=formatYouTubeUrl(item.url),docs=formatGoogleDocsEmbedUrl(item.url),audio=isAudioUrl(item.url),pdf=ehPdf(item.url);
      const cabeca='<div class="doc-accordion" id="doc-item-'+m+'-'+l+'-'+key+'"><button class="doc-header" style="'+estiloBarraModulo(cor)+'" onclick="toggleDocAccordion('+m+','+l+',\''+key+'\')">';
      const fecha='<span class="toggle-icon">×</span></button><div class="doc-body" id="doc-body-'+m+'-'+l+'-'+key+'">';
      if(docs)return cabeca+'<span>📄 '+titulo+'</span>'+fecha+'<div class="doc-frame-container"><iframe src="'+docs+'" allow="autoplay"></iframe></div><div class="doc-footer"><a href="'+item.url+'" target="_blank" class="btn-link-general">↗ Abrir original</a></div></div></div>';
      if(pdf)return cabeca+'<span>📄 '+titulo+'</span>'+fecha+'<div class="doc-frame-container"><iframe src="'+item.url+(item.url.indexOf('#')>=0?'':'#view=FitH')+'"></iframe></div><div class="doc-footer"><a href="'+item.url+'" target="_blank" class="btn-link-general">↗ Abrir original</a></div></div></div>';
      if(yt)return cabeca+'<span>🎬 '+titulo+'</span>'+fecha+'<div><div class="video-responsive"><iframe src="'+yt+'" allowfullscreen></iframe></div></div></div></div>';
      if(audio)return cabeca+'<span>🎧 '+titulo+'</span>'+fecha+'<div class="audio-container"><audio class="audio-player" controls src="'+item.url+'"></audio></div></div></div>';
      return cabeca+'<span>🔗 '+titulo+'</span>'+fecha+'<div style="padding:15px"><a href="'+(item.url||'#')+'" target="_blank" class="btn-link-general">Abrir material</a></div></div></div>';
    }
    function htmlDosLinks(lesson,m,l,cor){return(!lesson.links||!lesson.links.length)?'':lesson.links.map((item,i)=>renderMaterialItem(item,m,l,i,cor)).join('')}
    function liberarMateriaisNaTela(m,l){
      const modules=JSON.parse(localStorage.getItem(LS_MODULES)||'[]');
      const lesson=(((modules[m]||{}).lessons)||[])[l];
      if(!lesson)return;
      const wrap=document.getElementById('video-wrap-'+m+'-'+l);
      if(wrap)wrap.innerHTML=(lesson.videoUrl?htmlDoVideoLiberado(lesson,m,l):'')+htmlDosLinks(lesson,m,l);
      const item=document.getElementById('item-'+m),body=document.getElementById('body-'+m);
      if(item&&body){item.classList.add('active');body.style.maxHeight=(body.scrollHeight+4000)+'px'}
    }
    function ehBotaoCorrigir(btn){return(((btn.innerText||btn.value||'')+' '+(btn.id||'')+' '+(btn.name||'')+' '+(btn.className||'')).toUpperCase().includes('CORRIGIR RESPOSTAS')||btn.id==='btnCorrigir')}

    /* --- FUNÇÃO DE GERAÇÃO DE PDF OTIMIZADA E CORRIGIDA --- */
    function gerarPdfDaLicao(iframe){
      var win = iframe.contentWindow;
      var doc = iframe.contentDocument || (win && win.document);
      var src = doc && doc.getElementById('licaoImpressao');
      if (!src) { alert('Não foi possível localizar o conteúdo para PDF.'); return; }
      if (typeof html2pdf !== 'function') { alert('Biblioteca de PDF indisponível.'); return; }
      
      try { if (typeof win.gravarCache === 'function') win.gravarCache(); } catch(e){}

      // Remover clone anterior, se houver
      var antigo = document.getElementById('__pdfCloneWrap');
      if (antigo) antigo.remove();

      // Wrapper com largura A4 padronizada (794px aprox 210mm)
      var wrap = document.createElement('div');
      wrap.id = '__pdfCloneWrap';
      wrap.style.cssText = 'position:absolute;left:-9999px;top:0;width:794px;background:#ffffff;z-index:-1;';

      // Copiar os Estilos CSS do Iframe para garantir que o PDF mantenha o design
      var stylesHtml = '';
      Array.from(doc.querySelectorAll('style, link[rel="stylesheet"]')).forEach(function(st){
        stylesHtml += st.outerHTML;
      });

      var clone = src.cloneNode(true);
      clone.id = 'licaoImpressaoClone';
      clone.style.cssText = 'width:794px;max-width:794px;margin:0;padding:20px;box-shadow:none;border-radius:0;background:#ffffff;box-sizing:border-box;';

      // Esconder botões e elementos indesejados no PDF
      clone.querySelectorAll('#btnPdf,#btnCorrigir,.btn-pdf,.btn-corrigir,button,input[type="button"],input[type="submit"]').forEach(function(el){
        el.style.display = 'none';
      });

      // Garantir renderização das imagens
      clone.querySelectorAll('img').forEach(function(img){
        img.style.maxHeight = '60px';
        img.style.width = 'auto';
      });

      // Preservar valores digitados/selecionados pelo aluno
      var origCampos = src.querySelectorAll('input,textarea,select');
      var cloneCampos = clone.querySelectorAll('input,textarea,select');
      origCampos.forEach(function(inp, i){
        var c = cloneCampos[i];
        if (!c) return;
        if (inp.type === 'checkbox' || inp.type === 'radio') {
          c.checked = inp.checked;
          if(inp.checked) c.setAttribute('checked', 'checked');
        } else {
          c.value = inp.value;
          c.innerText = inp.value;
        }
      });

      // Montar a estrutura com o CSS e o Conteúdo
      wrap.innerHTML = stylesHtml;
      wrap.appendChild(clone);
      document.body.appendChild(wrap);

      // Nome do Arquivo
      var nome = 'Aluno';
      try { if (typeof win.val === 'function') nome = String(win.val('nomePessoa') || 'Aluno'); } catch(e){}
      nome = String(nome).trim().replace(/\s+/g, '_');
      var nLicao = '01';
      try {
        var m = String((win.location && win.location.pathname) || '').match(/Licao(\d+)/i);
        if (m) nLicao = m[1];
      } catch(e){}

      // Configurações do html2pdf ajustadas para evitar quebras incorretas
      var opt = {
        margin: [10, 10, 10, 10],
        filename: 'Licao' + nLicao + '-' + nome + '.pdf',
        image: { type: 'jpeg', quality: 0.98 },
        html2canvas: {
          scale: 2,
          useCORS: true,
          allowTaint: true,
          backgroundColor: '#ffffff',
          windowWidth: 794
        },
        pagebreak: { 
          mode: ['avoid-all', 'css', 'legacy'],
          avoid: ['.question-group', '.questao', '.bloco-questao', '.section-title', 'fieldset', '.header-container']
        },
        jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
      };

      html2pdf().set(opt).from(clone).save().then(function(){
        wrap.remove();
      }).catch(function(err){
        console.error(err);
        wrap.remove();
        alert('Ocorreu um erro ao gerar o PDF. Tente novamente.');
      });
    }

    function corrigirGeracaoPdf(iframe){
      try{
        var win=iframe.contentWindow;
        if(!win||win.__pdfCorrigido)return;
        win.__pdfCorrigido=true;
        win.baixarPdf=function(){
          if(!licaoEstaCompleta(iframe)){alert('Responda todas as alternativas da lição antes de baixar o PDF.');return false}
          gerarPdfDaLicao(iframe);
          return false;
        };
      }catch(e){}
    }
    function bloquearDownloadPdfAteCompletar(iframe){
      try{
        const doc=iframe.contentDocument||iframe.contentWindow.document;
        const bloquear=function(ev){
          const btn=ev.currentTarget;
          const texto=((btn.innerText||btn.value||'')+' '+(btn.id||'')+' '+(btn.className||'')).toUpperCase();
          if(!(texto.includes('PDF')||texto.includes('BAIXAR')||texto.includes('DOWNLOAD')))return;
          if(!licaoEstaCompleta(iframe)){ev.preventDefault();ev.stopImmediatePropagation();alert('Responda todas as alternativas da lição antes de baixar o PDF.');return false}
        };
        doc.querySelectorAll('button, input[type="button"], input[type="submit"], a').forEach(btn=>{
          if(btn.dataset.pdfGateBound==='1')return;
          const texto=((btn.innerText||btn.value||'')+' '+(btn.id||'')+' '+(btn.className||'')).toUpperCase();
          if(!(texto.includes('PDF')||texto.includes('BAIXAR')||texto.includes('DOWNLOAD')))return;
          btn.dataset.pdfGateBound='1';btn.addEventListener('click',bloquear,true);
        });
      }catch(e){}
    }
    function conectarFormularioLicao(m,l,iframe){
      try{
        const doc=iframe.contentDocument||iframe.contentWindow.document;
        corrigirGeracaoPdf(iframe);bloquearDownloadPdfAteCompletar(iframe);
        const tentar=function(ev){
          if(!licaoEstaCompleta(iframe)){if(ev){ev.preventDefault();ev.stopPropagation()}alert('Responda todas as alternativas da lição antes de clicar em Corrigir Respostas.');return}
          marcarMateriaisLiberados(m,l);
        };
        doc.querySelectorAll('button, input[type="button"], input[type="submit"], a').forEach(btn=>{
          if(!ehBotaoCorrigir(btn)||btn.dataset.unlockBound==='1')return;
          btn.dataset.unlockBound='1';btn.addEventListener('click',tentar,true);
        });
        iframe.contentWindow.liberarVideoAula=function(){tentarLiberarMateriais(m,l)};
      }catch(e){}
    }
    async function loadCursoFromCloud(){
      try{
        const res=await fetch(FIREBASE_URL+'?t='+Date.now());
        const data=await res.json();if(!data)return false;
        const snapshot=JSON.stringify({title:data.title||'',subtitle:data.subtitle||'',modules:data.modules||[]});
        if(snapshot===lastCourseSnapshot)return false;
        lastCourseSnapshot=snapshot;
        if(data.title)localStorage.setItem(LS_TITLE,data.title);
        if(data.subtitle)localStorage.setItem(LS_SUBTITLE,data.subtitle);
        if(data.modules)localStorage.setItem(LS_MODULES,JSON.stringify(data.modules));
        return true;
      }catch(e){return false}
    }
    async function refreshStudentView(){
      const changed=await loadCursoFromCloud();
      if(!changed&&document.getElementById('course-modules').innerHTML.trim())return;
      loadCourseHeaderInfo();renderCourse();
    }
    function toggleSidebar(){document.getElementById('sidebar').classList.toggle('collapsed')}
    function loadCourseHeaderInfo(){
      document.getElementById('course-title-display').innerText=localStorage.getItem(LS_TITLE)||'Discipulado IPB';
      document.getElementById('course-subtitle-display').innerText=localStorage.getItem(LS_SUBTITLE)||'Acesse os módulos e aulas abaixo';
    }
    function renderCourse(){
      const container=document.getElementById('course-modules');
      const sidebarMenu=document.getElementById('sidebar-menu');
      const modules=JSON.parse(localStorage.getItem(LS_MODULES)||'[]');
      if(!modules.length){
        container.innerHTML='<div class="empty-state"><h3>Nenhum módulo cadastrado ainda.</h3></div>';
        sidebarMenu.innerHTML='<li style="color:#c5d4a1;font-size:.85rem;padding:10px">Sem conteúdo.</li>';
        return;
      }
      sidebarMenu.innerHTML=modules.map((module,m)=>{
        if(isLocked(module.releaseDate))return '<li class="sidebar-module"><button class="sidebar-module-title locked" disabled>🔒 '+module.title+'</button></li>';
        const sub=(module.lessons||[]).map((lesson,l)=>{
          if(isLocked(lesson.releaseDate))return '<li><button class="sidebar-subitem" disabled>🔒 '+lesson.title+'</button></li>';
          let extra='';
          if(lesson.firstHtmlPage)extra+='<li><button class="sidebar-subitem" onclick="handleSidebarSubitemClick('+m+','+l+',\'html\')">📋 '+(lesson.firstHtmlTitle||lesson.firstHtmlPage.replace('.html',''))+'</button></li>';
          if(lesson.videoUrl&&materiaisLiberados(lesson,m,l))extra+='<li><button class="sidebar-subitem" onclick="abrirVideo('+m+','+l+')">🎬 '+(lesson.videoTitle||'Vídeo da aula')+'</button></li>';
          if(materiaisLiberados(lesson,m,l)&&lesson.links){
            extra+=lesson.links.map((item,i)=>isLocked(item.releaseDate)?'':'<li><button class="sidebar-subitem" onclick="handleSidebarSubitemClick('+m+','+l+',\'link'+i+'\')">🔗 '+(item.subtitle||item.title||'Material')+'</button></li>').join('');
          }
          return '<li><button class="sidebar-subitem" onclick="handleSidebarLessonClick('+m+','+l+')">'+lesson.title+'</button></li>'+extra;
        }).join('');
        return '<li class="sidebar-module" id="sidebar-mod-'+m+'"><button class="sidebar-module-title" onclick="toggleSidebarModule('+m+')"><span>'+module.title+'</span><span>▾</span></button><ul class="sidebar-sublist">'+sub+'</ul></li>';
      }).join('');
      container.innerHTML=modules.map((module,m)=>{
        const cor=corTituloModulo(m),borda='border:3px solid '+cor+';';
        if(isLocked(module.releaseDate))return '<div class="accordion-item is-locked" id="item-'+m+'" style="'+borda+'"><div class="accordion-header" style="background:'+cor+'"><span>🔒 '+module.title+'</span><div class="lock-notice">Disponível em: '+new Date(module.releaseDate).toLocaleString('pt-BR')+'</div></div></div>';
        const lessons=(module.lessons||[]).map((lesson,l)=>renderLessonBlock(module,m,lesson,l,cor)).join('');
        return '<div class="accordion-item" id="item-'+m+'" style="'+borda+'"><button class="accordion-header" style="background:'+cor+'" onclick="toggleAccordion('+m+')"><span>'+module.title+'</span><span class="toggle-icon">+</span></button><div class="accordion-body" id="body-'+m+'"><div class="accordion-content">'+(module.description?'<p class="lesson-text">'+module.description+'</p>':'')+(lessons||'<p class="lesson-text">Nenhuma lição neste módulo.</p>')+'</div></div></div>';
      }).join('');
    }
    function renderLessonBlock(module,m,lesson,l,corTitulo){
      const cor=corTitulo||corTituloModulo(m);
      if(isLocked(lesson.releaseDate))return '<div class="section-block lesson-block" id="lesson-'+m+'-'+l+'"><div class="doc-accordion"><div class="doc-header" style="cursor:not-allowed;color:#6b7a52;'+estiloBarraModulo(cor)+'"><span>🔒 '+lesson.title+'</span><div class="lock-notice">Disponível em: '+new Date(lesson.releaseDate).toLocaleString('pt-BR')+'</div></div></div></div>';
      const liberado=materiaisLiberados(lesson,m,l);
      const precisa=!!(lesson.firstHtmlPage||lesson.lockLinksUntilLessonSubmit);
      const email=encodeURIComponent(lesson.lessonEmail||DEFAULT_EMAIL);
      const src=lesson.firstHtmlPage?(lesson.firstHtmlPage+'?lessonIndex='+m+'-'+l+'&email='+email):'';
      const licao=lesson.firstHtmlPage?'<div class="doc-accordion" id="doc-item-'+m+'-'+l+'-html"><button class="doc-header" style="'+estiloBarraModulo(cor)+'" onclick="toggleDocAccordion('+m+','+l+',\'html\')"><span>📋 '+(lesson.firstHtmlTitle||lesson.firstHtmlPage.replace('.html',''))+'</span><span class="toggle-icon">×</span></button><div class="doc-body" id="doc-body-'+m+'-'+l+'-html"><iframe class="licao-frame" src="'+src+'" onload="conectarFormularioLicao('+m+','+l+', this)"></iframe></div></div>':'';
      let extras='<div class="section-block" id="video-wrap-'+m+'-'+l+'">';
      if(precisa&&!liberado&&(lesson.videoUrl||(lesson.links&&lesson.links.length)))extras+=avisoMateriaisBloqueados();
      else extras+=(lesson.videoUrl&&(!precisa||liberado)?htmlDoVideoLiberado(lesson,m,l,cor):'')+((!precisa||liberado)?htmlDosLinks(lesson,m,l,cor):'');
      extras+='</div>';
      return '<div class="section-block lesson-block" id="lesson-'+m+'-'+l+'"><h3 class="lesson-title">'+lesson.title+'</h3>'+(lesson.description?'<p class="lesson-text">'+lesson.description+'</p>':'')+licao+extras+'</div>';
    }
    function collapseAllModules(){
      document.querySelectorAll('.doc-accordion.active, .accordion-item.active').forEach(item=>{
        item.classList.remove('active');
        const body=item.querySelector('.doc-body, .accordion-body');
        if(body)body.style.maxHeight=null;
      });
    }
    function toggleSidebarModule(i){const el=document.getElementById('sidebar-mod-'+i);if(el)el.classList.toggle('active');openAccordion(i);scrollToElement('item-'+i)}
    function handleSidebarLessonClick(m,l){openAccordion(m);scrollToElement('lesson-'+m+'-'+l)}
    function handleSidebarSubitemClick(m,l,key){openAccordion(m);setTimeout(()=>toggleDocAccordion(m,l,key),120)}
    function abrirVideo(m,l){
      const lesson=((((JSON.parse(localStorage.getItem(LS_MODULES)||'[]')[m]||{}).lessons)||[])[l])||{};
      if(!materiaisLiberados(lesson,m,l))return;
      openAccordion(m);setTimeout(()=>toggleDocAccordion(m,l,'video'),150);
    }
    function scrollToElement(id){const el=document.getElementById(id);if(el)el.scrollIntoView({behavior:'smooth',block:'center'})}
    function openAccordion(i){
      const item=document.getElementById('item-'+i),body=document.getElementById('body-'+i);
      if(item&&body&&!item.classList.contains('is-locked')&&!item.classList.contains('active')){item.classList.add('active');body.style.maxHeight=(body.scrollHeight+4000)+'px'}
    }
    function toggleAccordion(i){
      const item=document.getElementById('item-'+i),body=document.getElementById('body-'+i);
      if(!item||item.classList.contains('is-locked'))return;
      if(item.classList.contains('active')){item.classList.remove('active');body.style.maxHeight=null}
      else{item.classList.add('active');body.style.maxHeight=(body.scrollHeight+4000)+'px'}
    }
    function toggleDocAccordion(m,l,key){
      const item=document.getElementById('doc-item-'+m+'-'+l+'-'+key);
      const body=document.getElementById('doc-body-'+m+'-'+l+'-key');
      const main=document.getElementById('body-'+m);
      if(!item||!body)return;
      if(item.classList.contains('active')){item.classList.remove('active');body.style.maxHeight=null}
      else{
        item.classList.add('active');
        const extra=body.querySelector('.doc-frame-container')?980:120;
        body.style.maxHeight=(body.scrollHeight+extra)+'px';
        if(main)main.style.maxHeight=(main.scrollHeight+body.scrollHeight+extra+200)+'px';
      }
    }
    window.addEventListener('message',function(event){
      if(!event.data||event.data.type!=='CORRIGIR_RESPOSTAS')return;
      const p=String(event.data.lessonIndex||'').split('-');
      const m=Number(p[0]),l=Number(p[1]);
      if(Number.isNaN(m)||Number.isNaN(l))return;
      if(event.data.completo===false||event.data.todasFeitas===false){alert('Responda todas as alternativas da lição antes de clicar em Corrigir Respostas.');return}
      tentarLiberarMateriais(m,l);
    });
    document.addEventListener('DOMContentLoaded',()=>{refreshStudentView();setInterval(refreshStudentView,15000)});
    document.addEventListener('visibilitychange',()=>{if(!document.hidden)refreshStudentView()});
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Plataforma de Curso - Área do Aluno</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; color: #333; display: flex; min-height: 100vh; }
    .app-layout { display: flex; width: 100%; }
    .sidebar { width: 280px; background-color: #1e293b; color: #f8fafc; padding: 20px 15px; height: 100vh; position: sticky; top: 0; overflow-y: auto; flex-shrink: 0; border-right: 1px solid #334155; transition: width 0.3s ease, padding 0.3s ease; }
    .sidebar.collapsed { width: 60px; padding: 15px 10px; overflow-x: hidden; }
    .sidebar-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; padding-bottom: 10px; border-bottom: 1px solid #334155; }
    .sidebar-header h2 { font-size: 1.1rem; text-transform: uppercase; letter-spacing: 0.8px; color: #94a3b8; white-space: nowrap; }
    .sidebar.collapsed .sidebar-header h2, .sidebar.collapsed .sidebar-menu { display: none; }
    .btn-toggle-sidebar { background: none; border: none; color: #94a3b8; font-size: 1.4rem; cursor: pointer; display: flex; align-items: center; justify-content: center; width: 36px; height: 36px; border-radius: 6px; transition: background-color 0.2s, color 0.2s; }
    .btn-toggle-sidebar:hover { background-color: #334155; color: #fff; }
    .sidebar.collapsed .sidebar-header { border-bottom: none; margin-bottom: 0; padding-bottom: 0; justify-content: center; }
    .sidebar-menu { list-style: none; }
    .sidebar-module { margin-bottom: 10px; }
    .sidebar-module-title { width: 100%; background: none; border: none; color: #e2e8f0; font-size: 0.95rem; font-weight: 600; text-align: left; padding: 10px 12px; border-radius: 6px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; transition: background-color 0.2s, color 0.2s; }
    .sidebar-module-title:hover { background-color: #334155; color: #fff; }
    .sidebar-module-title.locked { color: #64748b; cursor: not-allowed; opacity: 0.7; }
    .sidebar-sublist { list-style: none; padding-left: 15px; margin-top: 5px; display: none; }
    .sidebar-module.active .sidebar-sublist { display: block; }
    .sidebar-subitem { width: 100%; background: none; border: none; color: #94a3b8; font-size: 0.85rem; text-align: left; padding: 8px 10px; border-radius: 4px; cursor: pointer; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .sidebar-subitem:hover { color: #38bdf8; background-color: rgba(255, 255, 255, 0.05); }
    
    /* Área Principal com transição acompanhando a Sidebar */
    .main-content { flex: 1; padding: 30px 25px; max-width: 900px; margin: 0 auto; transition: max-width 0.3s ease, margin 0.3s ease; }
    .sidebar.collapsed + .main-content { max-width: 1100px; }

    header { margin-bottom: 25px; }
    .header-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 15px; }
    .header-title h1 { color: #1a252f; font-size: 2rem; margin-bottom: 8px; }
    .header-title p { color: #7f8c8d; }
    .btn-collapse-all { background-color: transparent; color: #64748b; border: 1px solid #cbd5e1; padding: 6px 12px; border-radius: 6px; font-size: 0.8rem; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
    .btn-collapse-all:hover { background-color: #f1f5f9; color: #0f172a; border-color: #94a3b8; }
    
    /* Módulos e Bloqueio */
    .accordion-item { background-color: #fff; border-radius: 8px; margin-bottom: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); overflow: hidden; border: 1px solid #e1e8ed; }
    .accordion-item.is-locked { border-color: #cbd5e1; background-color: #f8fafc; }
    .accordion-header { width: 100%; background: none; border: none; outline: none; padding: 20px 25px; font-size: 1.15rem; font-weight: 600; color: #2c3e50; text-align: left; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
    .accordion-item.is-locked .accordion-header { cursor: not-allowed; color: #64748b; }
    .accordion-header:hover:not(.is-locked .accordion-header) { background-color: #f8f9fa; }
    
    .lock-notice { display: flex; align-items: center; gap: 8px; font-size: 0.85rem; background-color: #fef3c7; color: #b45309; padding: 6px 12px; border-radius: 6px; font-weight: 600; }
    
    .toggle-icon { width: 32px; height: 32px; background-color: #eef2f5; color: #2563eb; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.4rem; font-weight: bold; flex-shrink: 0; margin-left: 15px; }
    .accordion-item.active > .accordion-header .toggle-icon, .doc-accordion.active > .doc-header .toggle-icon { transform: rotate(45deg); background-color: #fee2e2; color: #dc2626; }
    
    .accordion-body { max-height: 0; overflow: hidden; transition: max-height 0.3s cubic-bezier(0, 1, 0, 1); background-color: #ffffff; }
    .accordion-content { padding: 0 25px 25px 25px; border-top: 1px solid #f0f0f0; }
    .section-block { margin-top: 20px; }
    .lesson-text { line-height: 1.6; color: #475569; white-space: pre-wrap; }
    
    .video-responsive { position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden; border-radius: 8px; }
    .video-responsive iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0; }
    .audio-container { padding: 12px 16px; max-width: 450px; }
    audio.audio-player { width: 100%; height: 40px; border-radius: 6px; outline: none; display: block; }
    
    .doc-accordion { border: 1px solid #cbd5e1; border-radius: 8px; overflow: hidden; background-color: #f8fafc; margin-top: 10px; }
    .doc-header { width: 100%; background: #f1f5f9; border: none; padding: 14px 18px; font-size: 0.95rem; font-weight: 600; color: #1e293b; display: flex; justify-content: space-between; align-items: center; cursor: pointer; }
    .doc-header:hover { background-color: #e2e8f0; }
    .doc-body { max-height: 0; overflow: hidden; transition: max-height 0.3s ease-out; }
    .doc-body-inner { padding: 15px; }
    .doc-frame-container { width: 100%; height: 550px; border: none; background: #fff; }
    .doc-frame-container iframe { width: 100%; height: 100%; border: none; }
    .doc-footer { padding: 10px 15px; background-color: #f8fafc; border-top: 1px solid #e2e8f0; text-align: right; }
    .btn-link-general { display: inline-flex; align-items: center; gap: 8px; background-color: #2563eb; color: white; padding: 10px 18px; border-radius: 6px; text-decoration: none; font-weight: 600; font-size: 0.9rem; }
    .empty-state { text-align: center; padding: 40px; background: white; border-radius: 8px; color: #64748b; }
    @media (max-width: 768px) { .app-layout { flex-direction: column; } .sidebar { width: 100%; height: auto; position: relative; } .sidebar.collapsed { width: 100%; } }
  </style>
</head>
<body>

  <div class="app-layout">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <h2>📚 Módulos</h2>
        <button class="btn-toggle-sidebar" onclick="toggleSidebar()" title="Alternar Menu">☰</button>
      </div>
      <ul class="sidebar-menu" id="sidebar-menu"></ul>
    </aside>

    <main class="main-content">
      <header>
        <div class="header-top">
          <div class="header-title">
            <h1 id="course-title-display">Curso de Capacitação</h1>
            <p id="course-subtitle-display">Acesse os módulos e aulas abaixo</p>
          </div>
          <button class="btn-collapse-all" onclick="collapseAllModules()">
            <span>▲</span> Fechar todos
          </button>
        </div>
      </header>

      <div id="course-modules"></div>
    </main>
  </div>

  <script>
    function toggleSidebar() {
      document.getElementById('sidebar').classList.toggle('collapsed');
    }

    function loadCourseHeaderInfo() {
      document.getElementById('course-title-display').innerText = localStorage.getItem('course_title') || 'Curso de Capacitação';
      document.getElementById('course-subtitle-display').innerText = localStorage.getItem('course_subtitle') || 'Acesse os módulos e aulas abaixo';
    }

    function isModuleLocked(releaseDateStr) {
      if (!releaseDateStr) return false;
      const releaseDate = new Date(releaseDateStr);
      const now = new Date();
      return now < releaseDate;
    }

    function formatYouTubeUrl(url) {
      const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
      const match = url.match(regExp);
      return (match && match[2].length === 11) ? `https://www.youtube.com/embed/${match[2]}` : null;
    }

    function formatGoogleDocsEmbedUrl(url) {
      if (!url.includes('docs.google.com') && !url.includes('drive.google.com')) return null;
      if (url.includes('/document/d/')) return url.replace(/\/edit(\?.*)?$/, '/pub?embedded=true').replace(/\/view(\?.*)?$/, '/preview');
      if (url.includes('/presentation/d/')) return url.replace(/\/edit(\?.*)?$/, '/embed?start=false&loop=false');
      if (url.includes('/preview')) return url;
      return url.replace(/\/view(\?.*)?$/, '/preview').replace(/\/edit(\?.*)?$/, '/preview');
    }

    function isAudioUrl(url) {
      return url.match(/\.(mp3|wav|ogg|m4a|aac)$/i) || url.includes('audio') || url.includes('sound');
    }

    function renderLessons() {
      const container = document.getElementById('course-modules');
      const sidebarMenu = document.getElementById('sidebar-menu');
      const lessons = JSON.parse(localStorage.getItem('course_lessons') || '[]');

      if (lessons.length === 0) {
        container.innerHTML = `<div class="empty-state"><h3>Nenhum módulo cadastrado ainda.</h3></div>`;
        sidebarMenu.innerHTML = `<li style="color: #64748b; font-size: 0.85rem; padding: 10px;">Sem conteúdo.</li>`;
        return;
      }

      sidebarMenu.innerHTML = lessons.map((lesson, lessonIndex) => {
        const locked = isModuleLocked(lesson.releaseDate);
        if (locked) {
          return `
            <li class="sidebar-module">
              <button class="sidebar-module-title locked" disabled>
                <span>🔒 ${lesson.title || `Módulo ${lessonIndex + 1}`}</span>
              </button>
            </li>
          `;
        }

        let subItemsHTML = '';
        if (lesson.description) {
          subItemsHTML += `<li><button class="sidebar-subitem" onclick="handleSidebarSubitemClick(${lessonIndex}, 'desc')">📝 Orientação</button></li>`;
        }
        if (lesson.links) {
          subItemsHTML += lesson.links.map((item, linkIndex) => {
            const isLinkLocked = isModuleLocked(item.releaseDate);
            if (isLinkLocked) {
              return `
                <li>
                  <button class="sidebar-subitem" disabled style="opacity:0.6; cursor:not-allowed;">
                    🔒 ${item.subtitle || `Material ${linkIndex + 1}`}
                  </button>
                </li>
              `;
            }
            return `
              <li>
                <button class="sidebar-subitem" onclick="handleSidebarSubitemClick(${lessonIndex}, ${linkIndex})">
                  🔗 ${item.subtitle || `Material ${linkIndex + 1}`}
                </button>
              </li>
            `;
          }).join('');
        }

        return `
          <li class="sidebar-module" id="sidebar-mod-${lessonIndex}">
            <button class="sidebar-module-title" onclick="toggleSidebarModule(${lessonIndex})">
              <span>${lesson.title || `Módulo ${lessonIndex + 1}`}</span>
              <span style="font-size:0.8rem;">▾</span>
            </button>
            <ul class="sidebar-sublist">${subItemsHTML}</ul>
          </li>
        `;
      }).join('');

      container.innerHTML = lessons.map((lesson, lessonIndex) => {
        const locked = isModuleLocked(lesson.releaseDate);

        if (locked) {
          const dateStr = new Date(lesson.releaseDate).toLocaleString('pt-BR');
          return `
            <div class="accordion-item is-locked" id="item-${lessonIndex}">
              <div class="accordion-header">
                <span>🔒 ${lesson.title || `Módulo ${lessonIndex + 1}`}</span>
                <div class="lock-notice">
                  <span>Disponível em: ${dateStr}</span>
                </div>
              </div>
            </div>
          `;
        }

        let linksHTML = '';
        if (lesson.links && lesson.links.length > 0) {
          linksHTML = lesson.links.map((item, linkIndex) => {
            const isLinkLocked = isModuleLocked(item.releaseDate);
            if (isLinkLocked) {
              const linkDateStr = new Date(item.releaseDate).toLocaleString('pt-BR');
              return `
                <div class="section-block">
                  <div class="doc-accordion" style="border-color: #cbd5e1; background-color: #f8fafc;">
                    <div class="doc-header" style="cursor: not-allowed; color: #64748b;">
                      <span>🔒 ${item.subtitle || 'Material Agendado'}</span>
                      <div class="lock-notice" style="margin-left: auto;">
                        <span>Disponível em: ${linkDateStr}</span>
                      </div>
                    </div>
                  </div>
                </div>`;
            }

            const ytEmbed = formatYouTubeUrl(item.url);
            const docsEmbed = formatGoogleDocsEmbedUrl(item.url);
            const isAudio = isAudioUrl(item.url);

            if (ytEmbed) {
              return `
                <div class="section-block">
                  <div class="doc-accordion" id="doc-item-${lessonIndex}-${linkIndex}">
                    <button class="doc-header" onclick="toggleDocAccordion(${lessonIndex}, ${linkIndex})">
                      <span>🎬 ${item.subtitle || 'Vídeo da aula'}</span>
                      <span class="toggle-icon">+</span>
                    </button>
                    <div class="doc-body" id="doc-body-${lessonIndex}-${linkIndex}">
                      <div class="doc-body-inner">
                        <div class="video-responsive"><iframe src="${ytEmbed}" allowfullscreen></iframe></div>
                      </div>
                    </div>
                  </div>
                </div>`;
            }

            if (isAudio) {
              return `
                <div class="section-block">
                  <div class="doc-accordion" id="doc-item-${lessonIndex}-${linkIndex}">
                    <button class="doc-header" onclick="toggleDocAccordion(${lessonIndex}, ${linkIndex})">
                      <span>🎧 ${item.subtitle || 'Áudio da aula'}</span>
                      <span class="toggle-icon">+</span>
                    </button>
                    <div class="doc-body" id="doc-body-${lessonIndex}-${linkIndex}">
                      <div class="audio-container"><audio class="audio-player" controls src="${item.url}"></audio></div>
                    </div>
                  </div>
                </div>`;
            }

            if (docsEmbed) {
              return `
                <div class="section-block">
                  <div class="doc-accordion" id="doc-item-${lessonIndex}-${linkIndex}">
                    <button class="doc-header" onclick="toggleDocAccordion(${lessonIndex}, ${linkIndex})">
                      <span>📄 ${item.subtitle || 'Documento Google Docs'}</span>
                      <span class="toggle-icon">+</span>
                    </button>
                    <div class="doc-body" id="doc-body-${lessonIndex}-${linkIndex}">
                      <div class="doc-frame-container"><iframe src="${docsEmbed}"></iframe></div>
                      <div class="doc-footer">
                        <a href="${item.url}" target="_blank" class="btn-link-general" style="font-size:0.8rem; padding:6px 12px;">↗ Abrir original</a>
                      </div>
                    </div>
                  </div>
                </div>`;
            }

            return `
              <div class="section-block">
                <h4>${item.subtitle}</h4>
                <a href="${item.url}" target="_blank" class="btn-link-general">🔗 Acesse: ${item.subtitle}</a>
              </div>`;
          }).join('');
        }

        return `
          <div class="accordion-item" id="item-${lessonIndex}">
            <button class="accordion-header" onclick="toggleAccordion(${lessonIndex})">
              <span>${lesson.title || `Módulo ${lessonIndex + 1}`}</span>
              <span class="toggle-icon">+</span>
            </button>
            <div class="accordion-body" id="body-${lessonIndex}">
              <div class="accordion-content">
                ${lesson.description ? `<div class="section-block"><p class="lesson-text">${lesson.description}</p></div>` : ''}
                ${linksHTML}
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    function collapseAllModules() {
      document.querySelectorAll('.doc-accordion.active').forEach(item => {
        item.classList.remove('active');
        const body = item.querySelector('.doc-body');
        if (body) body.style.maxHeight = null;
      });
      document.querySelectorAll('.accordion-item.active').forEach(item => {
        item.classList.remove('active');
        const body = item.querySelector('.accordion-body');
        if (body) body.style.maxHeight = null;
      });
    }

    function toggleSidebarModule(index) {
      const sidebarMod = document.getElementById(`sidebar-mod-${index}`);
      if (sidebarMod) sidebarMod.classList.toggle('active');
      openAccordion(index);
      scrollToElement(`item-${index}`);
    }

    function handleSidebarSubitemClick(lessonIndex, targetKey) {
      openAccordion(lessonIndex);
      if (targetKey === 'desc') {
        scrollToElement(`item-${lessonIndex}`);
        return;
      }
      const docItem = document.getElementById(`doc-item-${lessonIndex}-${targetKey}`);
      if (docItem) {
        toggleDocAccordion(lessonIndex, targetKey);
        scrollToElement(`doc-item-${lessonIndex}-${targetKey}`);
      } else {
        scrollToElement(`item-${lessonIndex}`);
      }
    }

    function scrollToElement(id) {
      const el = document.getElementById(id);
      if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }

    function openAccordion(index) {
      const item = document.getElementById(`item-${index}`);
      const body = document.getElementById(`body-${index}`);
      if (item && body && !item.classList.contains('is-locked') && !item.classList.contains('active')) {
        item.classList.add('active');
        body.style.maxHeight = (body.scrollHeight + 1000) + "px";
      }
    }

    function toggleAccordion(index) {
      const item = document.getElementById(`item-${index}`);
      const body = document.getElementById(`body-${index}`);
      if (!item || item.classList.contains('is-locked')) return;

      if (item.classList.contains('active')) {
        item.classList.remove('active');
        body.style.maxHeight = null;
      } else {
        item.classList.add('active');
        body.style.maxHeight = (body.scrollHeight + 1000) + "px";
      }
    }

    function toggleDocAccordion(lessonIndex, linkIndex) {
      const docItem = document.getElementById(`doc-item-${lessonIndex}-${linkIndex}`);
      const docBody = document.getElementById(`doc-body-${lessonIndex}-${linkIndex}`);
      const mainBody = document.getElementById(`body-${lessonIndex}`);
      if (!docItem || !docBody) return;

      if (docItem.classList.contains('active')) {
        docItem.classList.remove('active');
        docBody.style.maxHeight = null;
      } else {
        docItem.classList.add('active');
        const contentHeight = docBody.scrollHeight;
        docBody.style.maxHeight = contentHeight + "px";
        mainBody.style.maxHeight = (mainBody.scrollHeight + contentHeight + 50) + "px";
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      loadCourseHeaderInfo();
      renderLessons();
    });
  </script>
</body>

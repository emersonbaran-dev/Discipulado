<script>
  const params = new URLSearchParams(window.location.search);
  const EMAIL_DESTINO = params.get('email') || 'emersonbaran@gmail.com';
  const LESSON_INDEX = Number(params.get('lessonIndex') || '0');
  document.getElementById('emailDestinoTexto').textContent = EMAIL_DESTINO;

  function letraRef(letra) {
    const mapa = { A: 'A - Sl 139.7-10', B: 'B - Sl 90.2', C: 'C - Ml 3.6', D: 'D - Jo 5.26' };
    return mapa[letra] || letra || '-';
  }
  function val(id) {
    const el = document.getElementById(id);
    return el ? el.value.trim() : '';
  }
  function preencherFolha(nome, dataBr) {
    document.getElementById('pdf-nome').textContent = nome;
    document.getElementById('pdf-data').textContent = dataBr;
    ['q1','q2','q3','q4','q6','q7','q8'].forEach(function(id) {
      document.getElementById('pdf-' + id).textContent = val(id);
    });
    document.getElementById('pdf-q5a').textContent = letraRef(val('q5a'));
    document.getElementById('pdf-q5b').textContent = letraRef(val('q5b'));
    document.getElementById('pdf-q5c').textContent = letraRef(val('q5c'));
    document.getElementById('pdf-q5d').textContent = letraRef(val('q5d'));
  }
  function montarRelatorioTexto(nome, dataBr) {
    return [
      'RELATÓRIO - DISCIPULADO LIÇÃO 10 - DEUS PAI',
      'Nome: ' + nome,
      'Data: ' + dataBr,
      '',
      '1) Mt 3.16-17: ' + val('q1'),
      '2) 2Co 13.13: ' + val('q2'),
      '3) Hb 11.6: ' + val('q3'),
      '4) Jr 23.23: ' + val('q4'),
      '5) Eterno: ' + letraRef(val('q5a')),
      '   Onipresente: ' + letraRef(val('q5b')),
      '   Autoexistente: ' + letraRef(val('q5c')),
      '   Imutável: ' + letraRef(val('q5d')),
      '6) 2 Jo 1.3: ' + val('q6'),
      '7) At 3.14: ' + val('q7'),
      '8) Rm 2.4: ' + val('q8')
    ].join('\n');
  }
  function avisarAluno() {
    try {
      if (window.parent && window.parent !== window) {
        window.parent.postMessage({ type: 'LICAO_ENVIADA', lessonIndex: LESSON_INDEX }, '*');
        if (typeof window.parent.liberarVideoAula === 'function') {
          window.parent.liberarVideoAula(LESSON_INDEX);
        }
      }
    } catch (e) {}
  }
  function abrirEmail(nome, texto) {
    const a = document.createElement('a');
    a.href = 'mailto:' + EMAIL_DESTINO
      + '?subject=' + encodeURIComponent('Relatório Lição 10 - ' + nome)
      + '&body=' + encodeURIComponent(texto);
    document.body.appendChild(a);
    a.click();
    a.remove();
  }

  async function enviarFormulario(event) {
    event.preventDefault();
    const form = document.getElementById('discipuladoForm');
    if (!form.checkValidity()) {
      form.reportValidity();
      return;
    }

    const nome = val('nomePessoa');
    const data = val('dataPreenchimento');
    const dataBr = data ? data.split('-').reverse().join('/') : '';
    const texto = montarRelatorioTexto(nome, dataBr);
    const arquivoNome = 'Relatorio-Licao10-' + nome.replace(/\s+/g, '_') + '.pdf';

    preencherFolha(nome, dataBr);

    // Abre a aba NO CLIQUE, senão o navegador bloqueia
    const abaPdf = window.open('', '_blank');
    if (abaPdf) {
      abaPdf.document.write('<p style="font-family:Arial;padding:20px">Gerando PDF da Lição 10...</p>');
    } else {
      alert('Permita pop-ups neste site para abrir o PDF.');
    }

    avisarAluno();
    abrirEmail(nome, texto);

    if (typeof html2pdf === 'undefined') {
      if (abaPdf) {
        abaPdf.document.body.innerHTML = '<pre style="font-family:Arial;padding:24px;white-space:pre-wrap;">' +
          texto.replace(/</g, '&lt;') + '</pre>';
      }
      return;
    }

    try {
      const pdfBlob = await html2pdf().set({
        margin: 10,
        filename: arquivoNome,
        image: { type: 'jpeg', quality: 0.95 },
        html2canvas: { scale: 2, useCORS: true },
        jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
      }).from(document.getElementById('folha-pdf')).outputPdf('blob');

      const pdfUrl = URL.createObjectURL(pdfBlob);
      if (abaPdf) abaPdf.location.href = pdfUrl;

      const arquivo = new File([pdfBlob], arquivoNome, { type: 'application/pdf' });
      const fd = new FormData();
      fd.append('_subject', 'Relatório Lição 10 - ' + nome);
      fd.append('_captcha', 'false');
      fd.append('nome', nome);
      fd.append('data', dataBr);
      fd.append('relatorio', texto);
      fd.append('anexo', arquivo, arquivoNome);
      fetch('https://formsubmit.co/ajax/' + EMAIL_DESTINO, { method: 'POST', body: fd })
        .catch(function() {});
    } catch (e) {
      if (abaPdf) {
        abaPdf.document.body.innerHTML = '<pre style="font-family:Arial;padding:24px;white-space:pre-wrap;">' +
          texto.replace(/</g, '&lt;') + '</pre>';
      }
    }
  }
</script>
